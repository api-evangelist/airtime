name: Airtime
description: >-
  Airtime is a video productivity platform offering essential tools for video at
  work. Successor to the mmhmm brand, Airtime bundles four integrated products:
  Camera (webcam enhancement and presenter effects for video calls), Recorder
  (HD screen and quick-capture recording up to an hour), Creator (presentation
  software that places the presenter inside their slides, supporting .ppt, .key
  and .pdf) and Stacks (a collaborative tool for sharing and reviewing materials
  in real time). It targets founders, educators, sales professionals and
  distributed teams. Added to the API Evangelist network as a portfolio company
  of GV and the SoftBank Vision Fund; this profile has been enriched with the
  provider's public security, trust and compliance surface.
